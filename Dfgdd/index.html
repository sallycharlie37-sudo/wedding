<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Youssef & Salma Wedding</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --velvet: #8b0000;
            --gold: #c5a059;
            --dark-gold: #8a6d3b;
            --cream: #fffaf0;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--cream);
            font-family: 'Cormorant Garamond', serif;
            touch-action: none;
        }

        .stage {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle, #ffffff, #f9f1d7);
        }

        .curtain {
            position: absolute;
            top: 0; width: 50.5%; height: 110%;
            background: var(--velvet);
            background-image: repeating-linear-gradient(90deg, rgba(0,0,0,0.3) 0px, transparent 40px, rgba(255,255,255,0.05) 80px);
            z-index: 100;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            cursor: grab;
            transition: transform 0.1s ease-out;
        }
        .left { left: 0; border-right: 1px solid var(--gold); }
        .right { right: 0; border-left: 1px solid var(--gold); }

        .content {
            text-align: center;
            z-index: 10;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1.5s ease-in-out;
            pointer-events: none; /* مقفول لحد ما الستارة تفتح */
        }
        .content.show { opacity: 1; transform: scale(1); pointer-events: auto; }

        h1 { 
            font-size: clamp(3rem, 10vw, 4.5rem); 
            font-weight: 300;
            background: linear-gradient(to bottom, var(--gold), var(--dark-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
        }

        .scratch-container { display: flex; justify-content: center; gap: 20px; margin-top: 40px; }
        .coin-wrapper { position: relative; text-align: center; }
        .scratch-box {
            position: relative; width: 85px; height: 85px;
            background: white; border-radius: 50%;
            border: 1px solid #eee; display: flex;
            justify-content: center; align-items: center;
            font-size: 1.3rem; color: #444; font-weight: 600;
        }
        .scratch-canvas { position: absolute; top: 0; left: 0; z-index: 5; border-radius: 50%; }

        .swipe-hint {
            position: absolute; top: 50%; width: 100%;
            text-align: center; color: white; z-index: 110;
            font-size: 1.2rem; letter-spacing: 5px;
            pointer-events: none; animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
    </style>
</head>
<body>

    <div class="swipe-hint" id="hint">← SWIPE TO OPEN →</div>

    <div class="curtain left" id="curtainL"></div>
    <div class="curtain right" id="curtainR"></div>

    <div class="stage">
        <div class="content" id="mainContent">
            <h1 style="font-size: 1.5rem; -webkit-text-fill-color: #aaa; margin-bottom: 10px;">THE WEDDING OF</h1>
            <h1>Youssef</h1>
            <div style="font-style: italic; font-size: 2rem; color: #ccc;">&</div>
            <h1>Salma</h1>
            
            <div class="scratch-container">
                <div class="coin-wrapper"><div class="scratch-box">25<canvas class="scratch-canvas" width="85" height="85"></canvas></div></div>
                <div class="coin-wrapper"><div class="scratch-box">12<canvas class="scratch-canvas" width="85" height="85"></canvas></div></div>
                <div class="coin-wrapper"><div class="scratch-box">2026<canvas class="scratch-canvas" width="85" height="85"></canvas></div></div>
            </div>
            <p style="margin-top: 25px; color: var(--gold); font-style: italic;">Scratch the gold coins</p>
        </div>
    </div>

    <script>
        let startX = 0;
        let isDragging = false;
        let isOpen = false; // متغير يمنع تداخل الستارة مع الخربشة

        const cl = document.getElementById('curtainL');
        const cr = document.getElementById('curtainR');
        const hint = document.getElementById('hint');
        const content = document.getElementById('mainContent');

        function handleStart(e) {
            if (isOpen) return; 
            startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            isDragging = true;
        }

        function handleMove(e) {
            if (!isDragging || isOpen) return;
            const currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const diff = currentX - startX;

            if (startX < window.innerWidth / 2 && diff < 0) {
                cl.style.transform = `translateX(${diff}px)`;
                if (Math.abs(diff) > 100) finishOpen();
            }
            if (startX > window.innerWidth / 2 && diff > 0) {
                cr.style.transform = `translateX(${diff}px)`;
                if (Math.abs(diff) > 100) finishOpen();
            }
        }

        function finishOpen() {
            isOpen = true;
            isDragging = false;
            cl.style.transition = "transform 1.2s ease-out";
            cr.style.transition = "transform 1.2s ease-out";
            cl.style.transform = "translateX(-110%)";
            cr.style.transform = "translateX(110%)";
            hint.style.display = 'none';
            content.classList.add('show');
            
            // أهم سطر: منع الستارة من استقبال أي لمسات تانية بعد ما تفتح
            setTimeout(() => {
                cl.style.pointerEvents = 'none';
                cr.style.pointerEvents = 'none';
            }, 1200);
        }

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('touchstart', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('touchend', () => isDragging = false);

        // --- كود الخربشة ---
        const canvases = document.querySelectorAll('.scratch-canvas');
        canvases.forEach(canvas => {
            const ctx = canvas.getContext('2d');
            let grad = ctx.createRadialGradient(42, 42, 5, 42, 42, 42);
            grad.addColorStop(0, '#fdf5e6'); grad.addColorStop(0.6, '#c5a059'); grad.addColorStop(1, '#8a6d3b');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(42, 42, 42, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.font = '10px Arial'; ctx.textAlign = 'center';
            ctx.fillText('SCRATCH', 42, 45);

            let scratching = false;
            function doScratch(e) {
                if (!scratching) return;
                const rect = canvas.getBoundingClientRect();
                const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
                const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.fill();
            }
            canvas.addEventListener('mousedown', () => scratching = true);
            canvas.addEventListener('touchstart', () => scratching = true);
            window.addEventListener('mouseup', () => scratching = false);
            window.addEventListener('touchend', () => scratching = false);
            canvas.addEventListener('mousemove', doScratch);
            canvas.addEventListener('touchmove', doScratch);
        });
    </script>
</body>
</html>
